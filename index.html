<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Language Interpreter</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0b2027, #8fb9e8);
  display: flex;
  justify-content: center;
}

/* App */
.app {
  width: 360px;
  background: #f2f2f2;
  border-radius: 25px;
  overflow: hidden;
  margin: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* Header */
.header {
  background: linear-gradient(135deg, #ff69b4, #3b73d1);
  color: white;
  text-align: center;
  padding: 30px 15px;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
}

.header h1 {
  font-size: 20px;
  margin: 0;
}

.header p {
  font-size: 12px;
}

.learning h2 {
  margin-top: 15px;
}

.audio-btn {
  margin-top: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  padding: 10px;
  display: inline-block;
}

/* Cards */
.cards {
  display: flex;
  gap: 12px;
  padding: 15px;
}

.card {
  flex: 1;
  background: #dfe5ec;
  border-radius: 15px;
  text-align: center;
  padding: 20px 10px;
}

.card img {
  width: 60px;
}

/* Buttons */
button {
  border: none;
  padding: 8px 15px;
  border-radius: 20px;
  background: linear-gradient(135deg, #a33383, #3b73d1);
  color: white;
  cursor: pointer;
}

/* Dictionary */
.dictionary {
  padding: 15px;
}

.items {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

.item {
  min-width: 40px;
  background: linear-gradient(135deg, #a33383, #3b73d1);
  color: white;
  padding: 15px;
  border-radius: 12px;
}

/* Bottom Nav */
.nav {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  background: white;
}

/* Camera */
.camera-section {
  display: none;
  padding: 10px;
}

video {
  width: 100%;
}
.head{
  
}

</style> <!-- ✅ IMPORTANT CLOSED -->

</head>

<body>

<div class="app">

  <div class="header">
    <h1>Sign Language Interpreter</h1>
    <p>Robotic Arm Understands Sign Language</p>

    <div class="learning">
      <h2>Learning Sign: "A"</h2>
      <div class="audio-btn">🔊</div>
    </div>
  </div>

  <div class="cards">

    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png">
      <h3>Robot Demo</h3>
      <p>Signing "A"</p>
      <button>START</button>
    </div>

    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
      <h3>Practice Yourself</h3>
      <p>Try Signing "A"</p>
      <button>PRACTICE</button>
    </div>

  </div>

  <div class="dictionary">
    <h2>Sign Language Dictionary</h2>

    <div class="items">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">I LOVE YOU</div>
      <div class="item">HELLO</div>
    </div>
    <h1 head>
    <button style="margin-top:10px;">VIEW ALL</button>
  </div>
</h1>
  <div class="camera-section" id="cameraSection">
    <video id="video" autoplay></video>
    <h3 id="output">Detected Sign: -</h3>
  </div>

  <div class="nav">
    <button onclick="goHome()">🏠 Home</button>
    <button onclick="startTranslate()">✋ Translate</button>
    <button>▶ Learn</button>
  </div>

</div>

<script>
function goHome() {
  document.getElementById("cameraSection").style.display = "none";
}

async function startTranslate() {
  const video = document.getElementById("video");
  const section = document.getElementById("cameraSection");

  section.style.display = "block";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    document.getElementById("output").innerText = "Camera Started ✅";
  } catch (error) {
    alert("Camera permission denied ❌");
  }
}
</script>

</body>
</html>
